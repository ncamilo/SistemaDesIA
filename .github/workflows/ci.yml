name: Qualidade
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - name: Install, check and test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/dev.ps1 install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/dev.ps1 check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/dev.ps1 test
      - name: Install, check and test (macOS/Linux)
        if: runner.os != 'Windows'
        env:
          PYTHON: python
        run: |
          bash scripts/dev.sh install
          bash scripts/dev.sh check
          bash scripts/dev.sh test
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-browser.txt
      - run: python -m playwright install --with-deps chromium
      - run: ruff check browser_tests
      - run: ruff format --check browser_tests
      - run: python -m pytest browser_tests -q
